; Elis Evleri - ESP32 koridor aydinlatma + guvenlik firmware
; Tek kod tabani, kat profili build_flags ile secilir.
;   pio run -e ground_floor   -> giris kati (3 PIR + dikdortgen + koridor + guvenlik)
;   pio run -e upper_floor    -> ust kat   (2 PIR + sadece koridor)

[platformio]
default_envs = ground_floor

[env]
platform = espressif32          ; uretimde surum sabitlemesi onerilir, or. espressif32@^6.9.0
board = esp32dev                ; genel ESP32 WROOM-32 karti
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D CORE_DEBUG_LEVEL=3
lib_deps =
    fastled/FastLED             ; WiFi / HTTPClient / WiFiClientSecure cekirdegin icinde

[env:ground_floor]
build_flags =
    ${env.build_flags}
    -D FLOOR_GROUND             ; 3 PIR + dikdortgen + koridor + guvenlik (duman/gaz/role/WhatsApp)

[env:upper_floor]
build_flags =
    ${env.build_flags}
    -D FLOOR_UPPER              ; 2 PIR + sadece koridor fade
    ; O katta duman/gaz dedektoru de varsa guvenligi acmak icin asagidaki satiri etkinlestir:
    ; -D ENABLE_SAFETY
