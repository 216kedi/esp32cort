; ELİS EVLERİ - Giriş Kat ESP32 Aydınlatma & Güvenlik Kontrolcüsü
; PlatformIO proje yapilandirmasi
;
; Derlemek/yuklemek icin:
;   pio run                 -> derle
;   pio run -t upload        -> ESP32'ye yukle
;   pio device monitor       -> seri monitor (115200 baud)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Adreslenebilir LED kutuphanesi (WS2812B / NeoPixel vb.)
lib_deps =
    fastled/FastLED@^3.6.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
